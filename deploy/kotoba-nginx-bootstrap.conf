user nginx;
worker_processes auto;
error_log /var/log/nginx/kotoba-error.log warn;
pid /run/kotoba-nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format kotoba '$remote_addr - $host [$time_local] "$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/kotoba-access.log kotoba;

    client_body_temp_path /var/cache/kotoba-nginx/client_temp;
    proxy_temp_path /var/cache/kotoba-nginx/proxy_temp;

    upstream kotoba_app {
        server 127.0.0.1:8080;
        keepalive 16;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name loken-loki.cn www.loken-loki.cn;

        client_max_body_size 256k;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
        }

        location / {
            proxy_pass http://kotoba_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
