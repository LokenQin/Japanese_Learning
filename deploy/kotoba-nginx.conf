user nginx;
worker_processes auto;
error_log /var/log/nginx/kotoba-error.log warn;
pid /run/kotoba-nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format kotoba '$remote_addr - $host [$time_local] "$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/kotoba-access.log kotoba;

    client_body_temp_path /var/cache/kotoba-nginx/client_temp;
    proxy_temp_path /var/cache/kotoba-nginx/proxy_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    upstream kotoba_app {
        server 127.0.0.1:8080;
        keepalive 16;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name loken-loki.cn www.loken-loki.cn;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
        }

        location / {
            return 301 https://loken-loki.cn$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name www.loken-loki.cn;

        ssl_certificate /etc/kotoba-nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/kotoba-nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        return 301 https://loken-loki.cn$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name loken-loki.cn;

        ssl_certificate /etc/kotoba-nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/kotoba-nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:KotobaTLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        client_max_body_size 256k;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self' 'sha256-Tb0U82G/+Ds0bziAVO8eD4GH9SK3R252nLFV7nEabBU='; style-src 'self' 'unsafe-inline'" always;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
        }

        location ^~ /assets/ {
            proxy_pass http://kotoba_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location ^~ /images/ {
            proxy_pass http://kotoba_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=604800" always;
        }

        location / {
            proxy_pass http://kotoba_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
